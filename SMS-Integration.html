<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finance Tracker Pro</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root { --primary: #4285F4; --bob: #ff6600; --jup: #22c55e; --secondary: #202124; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding-bottom: 100px; }

        .tabs { display: flex; background: var(--secondary); position: sticky; top: 0; z-index: 100; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: none; color: #94a3b8; font-size: 11px; font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; text-transform: uppercase; }
        .tab-btn.active { color: white; border-bottom-color: var(--primary); }
        .tab-btn.bob-tab.active { border-bottom-color: var(--bob); }
        .tab-btn.jup-tab.active { border-bottom-color: var(--jup); }

        .main-layout { display: flex; flex-direction: column; max-width: 1200px; margin: 15px auto; padding: 0 12px; gap: 20px; }
        @media (min-width: 900px) { .main-layout { flex-direction: row; align-items: flex-start; } }

        .list-container { flex: 2; width: 100%; }
        .summary-side { flex: 1; width: 100%; background: white; border-radius: 12px; padding: 15px; border: 1px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.05); position: sticky; top: 70px; }
        .summary-title { font-size: 14px; font-weight: 800; color: var(--secondary); margin-bottom: 10px; border-bottom: 2px solid var(--bg); padding-bottom: 5px; }
        .sum-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
        .sum-label { color: #64748b; font-weight: 600; }
        .sum-val { font-weight: 800; color: var(--secondary); }

        .item-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); position: relative; border: 1px solid #e2e8f0; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .m-name { font-weight: 800; color: var(--secondary); font-size: 14px; text-transform: uppercase; }
        .m-date { font-size: 12px; color: #64748b; font-weight: 600; }

        .paste-zone { background: #f1f5f9; border: 1px dashed #cbd5e1; border-radius: 8px; padding: 5px; margin-bottom: 10px; }
        .paste-zone textarea { width: 100%; border: none; background: transparent; font-size: 12px; resize: none; outline: none; height: 30px; color: #333; }
        
        /* Bulk Import Style */
        .bulk-import { background: #e8f5e9; border: 2px solid var(--jup); border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        .bulk-import textarea { width: 100%; height: 60px; border: 1px solid #c8e6c9; border-radius: 6px; padding: 8px; box-sizing: border-box; font-size: 12px; margin-bottom: 10px; }

        input { width: 100%; border: 1px solid #e2e8f0; padding: 8px; border-radius: 6px; font-size: 13px; font-weight: 600; box-sizing: border-box; margin-top: 4px; background: #fff; }
        label { font-size: 9px; font-weight: 800; color: #94a3b8; text-transform: uppercase; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 5px; }
        
        .btn-del { position: absolute; bottom: 10px; right: 10px; color: #cbd5e1; cursor: pointer; border: none; background: none; }
        .footer { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 15px; display: flex; justify-content: space-around; border-top: 1px solid #e2e8f0; z-index: 200; }
        .btn-add { background: var(--secondary); color: white; padding: 10px 25px; border-radius: 20px; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="tabs">
    <button class="tab-btn active" onclick="switchTab('giftcards', this)">Gift Cards</button>
    <button class="tab-btn bob-tab" onclick="switchTab('creditcards', this)">BOB Card</button>
    <button class="tab-btn jup-tab" onclick="switchTab('jupitercards', this)">Jupiter / CSB</button>
</div>

<div id="giftcards" class="container active">
    <div class="main-layout">
        <div id="giftList" class="list-container"></div>
        <div class="summary-side">
            <div class="summary-title">Voucher Summary</div>
            <div id="giftStat"></div>
        </div>
    </div>
    <div class="footer">
        <button onclick="exportData('GC_Data_V4')">Export</button>
        <button class="btn-add" onclick="addGift()">+ New Gift Card</button>
        <button onclick="triggerImport('GC_Data_V4')">Import</button>
    </div>
</div>

<div id="creditcards" class="container" style="display:none;">
    <div class="main-layout">
        <div id="bobList" class="list-container"></div>
        <div class="summary-side">
            <div class="summary-title">BOB Statement</div>
            <div id="bobStat"></div>
        </div>
    </div>
    <div class="footer">
        <button onclick="exportData('BOB_Data_V4')">Export</button>
        <button class="btn-add" style="background:var(--bob)" onclick="addBob()">+ New Spent</button>
        <button onclick="triggerImport('BOB_Data_V4')">Import</button>
    </div>
</div>

<div id="jupitercards" class="container" style="display:none;">
    <div class="main-layout">
        <div class="list-container">
            <div class="bulk-import">
                <div class="summary-title" style="color: var(--jup)">Magic SMS Importer</div>
                <textarea id="bulkJupInput" placeholder="Copy-paste multiple Jupiter/CSB SMS here..."></textarea>
                <button class="btn-add" style="background:var(--jup); width:100%; border-radius:8px;" onclick="processBulkJup()">Extract Transactions</button>
            </div>
            <div id="jupList"></div>
        </div>
        <div class="summary-side">
            <div class="summary-title">Jupiter Statement</div>
            <div id="jupStat"></div>
        </div>
    </div>
    <div class="footer">
        <button onclick="exportData('JUP_Data_V4')">Export</button>
        <button class="btn-add" style="background:var(--jup)" onclick="addJup()">+ Manual Entry</button>
        <button onclick="triggerImport('JUP_Data_V4')">Import</button>
    </div>
</div>

<input type="file" id="importFile" hidden onchange="processImport(event)">

<script>
    const DB_GIFT = "GC_Data_V4";
    const DB_BOB = "BOB_Data_V4";
    const DB_JUP = "JUP_Data_V4";
    let importTarget = "";

    window.onload = () => {
        load('giftList', DB_GIFT, addGift);
        load('bobList', DB_BOB, addBob);
        load('jupList', DB_JUP, addJup);
    };

    function switchTab(id, btn) {
        document.querySelectorAll('.container').forEach(c => c.style.display = 'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).style.display = 'block';
        btn.classList.add('active');
    }

    function load(id, key, fn) {
        const data = JSON.parse(localStorage.getItem(key)) || [];
        if (data.length === 0) fn(); else data.forEach(d => fn(d));
    }

    // --- RENDERERS ---
    function addGift(d = {}) {
        const div = document.createElement('div');
        div.className = "item-card";
        div.innerHTML = `
            <div class="paste-zone"><textarea placeholder="Paste Voucher SMS..." oninput="exGift(this)"></textarea></div>
            <div class="grid">
                <div><label>Voucher Code</label><input type="text" class="g-code" value="${d.code||''}" oninput="save('${DB_GIFT}')"></div>
                <div><label>PIN</label><input type="text" class="g-pin" value="${d.pin||''}" oninput="save('${DB_GIFT}')"></div>
            </div>
            <div class="grid">
                <div><label>Amount</label><input type="number" class="g-amt" value="${d.amt||''}" oninput="save('${DB_GIFT}')"></div>
                <div><label>Expiry</label><input type="date" class="g-date" value="${d.date||''}" oninput="save('${DB_GIFT}')"></div>
            </div>
            <button class="btn-del" onclick="this.parentElement.remove();save('${DB_GIFT}')"><i class="material-icons-round">delete</i></button>
        `;
        document.getElementById('giftList').prepend(div); save(DB_GIFT);
    }

    function addBob(d = {}) {
        const div = document.createElement('div');
        div.className = "item-card";
        div.innerHTML = `
            <div class="card-header"><span class="m-name">${d.merch || 'Merchant'}</span><span class="m-date">${d.date || 'Date'}</span></div>
            <div class="paste-zone"><textarea placeholder="Paste BOB SMS..." oninput="exBob(this)"></textarea></div>
            <div class="grid">
                <div><label>Merchant Name</label><input type="text" class="b-merch" value="${d.merch||''}" oninput="sync(this,'${DB_BOB}')"></div>
                <div><label>Amount</label><input type="number" class="b-amt" value="${d.amt||''}" oninput="save('${DB_BOB}')"></div>
            </div>
            <div class="grid-3">
                <div><label>Purchase Date</label><input type="date" class="b-date" value="${d.date||''}" oninput="sync(this,'${DB_BOB}')"></div>
                <div><label>MCC Code</label><input type="text" class="b-mcc" placeholder="Manual" value="${d.mcc||''}" oninput="save('${DB_BOB}')"></div>
                <div><label>Card Used</label><input type="text" class="b-card" value="${d.card||''}" oninput="save('${DB_BOB}')"></div>
            </div>
            <button class="btn-del" onclick="this.parentElement.remove();save('${DB_BOB}')"><i class="material-icons-round">delete</i></button>
        `;
        document.getElementById('bobList').prepend(div); save(DB_BOB);
    }

    function addJup(d = {}) {
        const div = document.createElement('div');
        div.className = "item-card";
        div.innerHTML = `
            <div class="card-header"><span class="m-name">${d.merch || 'Merchant'}</span><span class="m-date">${d.date || 'Date'}</span></div>
            <div class="paste-zone"><textarea placeholder="Paste Jupiter SMS..." oninput="exJup(this)"></textarea></div>
            <div class="grid">
                <div><label>Merchant Name</label><input type="text" class="j-merch" value="${d.merch||''}" oninput="sync(this,'${DB_JUP}')"></div>
                <div><label>Amount</label><input type="number" class="j-amt" value="${d.amt||''}" oninput="save('${DB_JUP}')"></div>
            </div>
            <div class="grid-3">
                <div><label>Purchase Date</label><input type="date" class="j-date" value="${d.date||''}" oninput="sync(this,'${DB_JUP}')"></div>
                <div><label>MCC Code</label><input type="text" class="j-mcc" placeholder="Manual" value="${d.mcc||''}" oninput="save('${DB_JUP}')"></div>
                <div><label>Card Used</label><input type="text" class="j-card" value="${d.card||''}" oninput="save('${DB_JUP}')"></div>
            </div>
            <button class="btn-del" onclick="this.parentElement.remove();save('${DB_JUP}')"><i class="material-icons-round">delete</i></button>
        `;
        document.getElementById('jupList').prepend(div); 
        sync(div.querySelector('.j-merch'), DB_JUP);
    }

    // --- BULK LOGIC ---
    function processBulkJup() {
        const input = document.getElementById('bulkJupInput').value;
        // Regex to capture amount, merchant, and date from typical Jupiter/CSB formats
        const regex = /₹([\d,.]+).*?to\s+(.*?)\s+on\s+(\d{4}-\d{2}-\d{2})/gi;
        let match;
        while ((match = regex.exec(input)) !== null) {
            addJup({
                amt: match[1].replace(/,/g, ''),
                merch: match[2].trim(),
                date: match[3],
                card: 'CSB/Jup',
                mcc: ''
            });
        }
        document.getElementById('bulkJupInput').value = "";
    }

    // --- EXTRACTION LOGIC ---
    function exGift(t) {
        setTimeout(() => {
            const c = t.closest('.item-card');
            const code = t.value.match(/(?:code|voucher)\s*(\d{10,})/i);
            const pin = t.value.match(/PIN[:\s]*(\d{4,8})/i);
            const date = t.value.match(/till\s+(\d{2}-\d{2}-\d{2,4})/i);
            if(code) c.querySelector('.g-code').value = code[1];
            if(pin) c.querySelector('.g-pin').value = pin[1];
            if(date) { const p = date[1].split('-'); c.querySelector('.g-date').value = `${p[2].length==2?'20'+p[2]:p[2]}-${p[1]}-${p[0]}`; }
            t.value = ""; save(DB_GIFT);
        }, 50);
    }

    function exBob(t) {
        setTimeout(() => {
            const c = t.closest('.item-card');
            const amt = t.value.match(/INR\s?([\d,.]+)/i);
            const merch = t.value.match(/at\s+(.*?)\s+on/i);
            const date = t.value.match(/on\s+(\d{2}-\d{2}-\d{4})/i);
            const card = t.value.match(/ending\s+(\d{4})/i);
            if(amt) c.querySelector('.b-amt').value = amt[1].replace(/,/g,'');
            if(merch) c.querySelector('.b-merch').value = merch[1].trim();
            if(card) c.querySelector('.b-card').value = card[1];
            if(date) { const p = date[1].split('-'); c.querySelector('.b-date').value = `${p[2]}-${p[1]}-${p[0]}`; }
            t.value = ""; sync(c.querySelector('.b-merch'), DB_BOB);
        }, 50);
    }

    function exJup(t) {
        setTimeout(() => {
            const c = t.closest('.item-card');
            const val = t.value;
            const amt = val.match(/₹([\d,.]+)/);
            const merch = val.match(/to\s+(.*?)\s+on/i);
            const date = val.match(/on\s+(\d{4}-\d{2}-\d{2})/i);
            const card = val.match(/Edge\s+(.*?)\s+Bank/i);

            if(amt) c.querySelector('.j-amt').value = amt[1].replace(/,/g,'');
            if(merch) c.querySelector('.j-merch').value = merch[1].trim();
            if(card) c.querySelector('.j-card').value = card[1];
            if(date) c.querySelector('.j-date').value = date[1];
            t.value = ""; sync(c.querySelector('.j-merch'), DB_JUP);
        }, 50);
    }

    function sync(el, key) {
        const c = el.closest('.item-card');
        const prefix = key === DB_BOB ? 'b' : 'j';
        c.querySelector('.m-name').innerText = c.querySelector(`.${prefix}-merch`).value || 'Merchant';
        c.querySelector('.m-date').innerText = c.querySelector(`.${prefix}-date`).value || 'Date';
        save(key);
    }

    function save(key) {
        const id = key === DB_GIFT ? 'giftList' : (key === DB_BOB ? 'bobList' : 'jupList');
        const cards = document.getElementById(id).querySelectorAll('.item-card');
        const arr = []; let total = 0; let merchants = {};

        cards.forEach(c => {
            if(key === DB_GIFT) {
                const a = parseFloat(c.querySelector('.g-amt').value)||0; total += a;
                arr.push({code:c.querySelector('.g-code').value, pin:c.querySelector('.g-pin').value, amt:a, date:c.querySelector('.g-date').value});
            } else {
                const prefix = key === DB_BOB ? 'b' : 'j';
                const a = parseFloat(c.querySelector(`.${prefix}-amt`).value)||0; total += a;
                const m = c.querySelector(`.${prefix}-merch`).value || 'Unknown';
                merchants[m] = (merchants[m]||0) + a;
                arr.push({merch:m, amt:a, date:c.querySelector(`.${prefix}-date`).value, mcc:c.querySelector(`.${prefix}-mcc`).value, card:c.querySelector(`.${prefix}-card`).value});
            }
        });
        localStorage.setItem(key, JSON.stringify(arr));
        renderStat(key, total, merchants);
    }

    function renderStat(key, total, mList) {
        const target = key === DB_GIFT ? 'giftStat' : (key === DB_BOB ? 'bobStat' : 'jupStat');
        let h = `<div class="sum-row"><span class="sum-label">Total Spent</span><span class="sum-val">₹${total.toLocaleString('en-IN')}</span></div>`;
        if(key !== DB_GIFT) {
            h += `<div style="margin-top:10px; font-size:10px; color:#94a3b8; font-weight:800;">MERCHANT BREAKDOWN</div>`;
            Object.entries(mList).sort((a,b)=>b[1]-a[1]).forEach(([n,v]) => {
                h += `<div class="sum-row"><span class="sum-label">${n}</span><span class="sum-val">₹${v.toLocaleString('en-IN')}</span></div>`;
            });
        }
        document.getElementById(target).innerHTML = h;
    }

    function exportData(key) {
        const blob = new Blob([localStorage.getItem(key)], {type:'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `${key}.json`; a.click();
    }
    function triggerImport(key) { importTarget = key; document.getElementById('importFile').click(); }
    function processImport(e) {
        const r = new FileReader(); r.onload = () => { localStorage.setItem(importTarget, r.result); location.reload(); };
        r.readAsText(e.target.files[0]);
    }
</script>
</body>
</html>
